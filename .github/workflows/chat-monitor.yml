name: chat-monitor

# Релей городского чата водителей gdebenz.ru в ntfy.
# Состояние (chat_state.json) хранится в приватном репозитории (DATA_REPO).
# Запускается только вручную (workflow_dispatch) — из внешнего cron (cron-job.org).
# Встроенное расписание GitHub отключено (троттлилось).
on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Опрос чата
        env:
          CHATWATCH_CITY: ${{ vars.CHAT_CITY }}
          CHATWATCH_TOPIC: ${{ vars.CHAT_TOPIC }}
          CHATWATCH_STATE: chat_state.json
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_PAT: ${{ secrets.DATA_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python3 monitor/chat_watch.py once
