name: tg-bot-config

# Многопользовательский Telegram-бот: регистрация по приглашению, настройка
# координат/топлива/темы каждого пользователя. Все данные (users.json,
# tg_bot_state.json) хранятся в отдельном приватном репозитории (DATA_REPO).
# Запускается из внешнего cron (cron-job.org) через workflow_dispatch —
# встроенное расписание GitHub отключено (троттлится).
on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Обработка команд бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN: ${{ vars.TELEGRAM_ADMIN }}
          USERS_FILE: users.json
          TGBOT_STATE: tg_bot_state.json
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_PAT: ${{ secrets.DATA_PAT }}
        run: python3 monitor/tg_bot.py once
