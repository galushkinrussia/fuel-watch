name: fuel-monitor

# Многопользовательский монитор топлива. Читает users.json и для каждого
# активного пользователя опрашивает его координаты, шлёт push в его ntfy-тему.
# Все данные (users.json, users_state.json, sends.jsonl) хранятся в отдельном
# приватном репозитории (DATA_REPO) через GitHub API — публичный репо только код.
# Запускается из внешнего cron (cron-job.org) через workflow_dispatch —
# встроенное расписание GitHub отключено (троттлится).
on:
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Опрос заправок (все пользователи)
        env:
          MULTI_USERS: users.json
          MULTI_STATE: users_state.json
          MULTI_SENDS: sends.jsonl
          MULTI_HISTORY: history.jsonl
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_PAT: ${{ secrets.DATA_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 monitor/multi_watch.py once
