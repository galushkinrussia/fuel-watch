name: fuel-monitor

# Многопользовательский монитор топлива. Читает users.json и для каждого
# активного пользователя опрашивает его координаты, шлёт push в его ntfy-тему.
# Запускается из внешнего cron (cron-job.org) через workflow_dispatch —
# встроенное расписание GitHub отключено (троттлится).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Опрос заправок (все пользователи)
        env:
          MULTI_USERS: users.json
          MULTI_STATE: users_state.json
        run: python3 monitor/multi_watch.py once

      - name: Сохранить состояние
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain users_state.json)" ]; then
            git add users_state.json
            git commit -m "chore: обновить состояние монитора"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep 3
            done
          fi
