name: fuel-monitor

# Запускается только вручную (workflow_dispatch) — из внешнего cron
# (cron-job.org). Встроенное расписание GitHub отключено (троттлилось).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Опрос заправок
        env:
          FUELWATCH_LAT: ${{ vars.LAT }}
          FUELWATCH_LON: ${{ vars.LON }}
          FUELWATCH_RADIUS: ${{ vars.RADIUS }}
          FUELWATCH_FUEL: ${{ vars.FUEL }}
          FUELWATCH_TOPIC: ${{ vars.TOPIC }}
          FUELWATCH_STATE: state.json
          FUELWATCH_HISTORY: history.jsonl
        run: python3 monitor/fuel_watch.py once

      - name: Сохранить состояние
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json history.jsonl)" ]; then
            git add state.json history.jsonl
            git commit -m "chore: обновить состояние заправок"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep 3
            done
          fi
